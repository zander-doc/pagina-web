<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Interno - ADDBOX Constructora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(26, 26, 26, 0.9);
            border-radius: 20px;
            border: 2px solid rgba(255, 99, 3, 0.3);
            max-width: 500px;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff 0%, #ff6303 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #b0b0b0;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(255, 99, 3, 0.1);
            border: 2px solid #ff6303;
            border-radius: 50px;
            color: #ff6303;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 15px 35px;
            background: linear-gradient(135deg, #ff6303 0%, #ff8c42 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 99, 3, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">&#128274;</div>
        <span class="badge">Acceso Restringido</span>
        <h1>Portal Interno ADDBOX</h1>
        <p>Sistema de inventario en configuración. Próximamente disponible para personal autorizado.</p>
        <a href="https://addboxconstructora.com" class="btn">Volver al Sitio Web</a>
    </div>
</body>
</html>
