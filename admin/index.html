<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Interno ADDBOX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 2px solid #ff6303;
            border-radius: 15px;
            max-width: 500px;
        }
        .lock {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 99, 3, 0.2);
            color: #ff6303;
            border: 1px solid #ff6303;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #ff6303;
        }
        p {
            color: #888;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #ff6303;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #ff7b29;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lock">🔐</div>
        <div class="badge">Acceso Restringido</div>
        <h1>Portal Interno ADDBOX</h1>
        <p>Sistema de inventario en configuración. Próximamente disponible para personal autorizado.</p>
        <a href="https://www.addboxconstructora.com" class="btn">Volver al Sitio Web</a>
    </div>
</body>
</html>
